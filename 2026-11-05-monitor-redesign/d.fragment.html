<style>
.dir-d{height:420px;background:#eaf0e8;color:#26382c;font-family:'Microsoft YaHei',system-ui,sans-serif;display:grid;grid-template-rows:auto auto 1fr;font-size:12px;line-height:1.6;overflow:hidden}.dir-d *{box-sizing:border-box}.dir-d button,.dir-d select{font:inherit;color:inherit;cursor:pointer}.dir-d button{border:1px solid #a5b7a4;background:transparent;padding:6px 10px;border-radius:0}.dir-d button:focus-visible{outline:2px solid #244e35;outline-offset:2px}.dir-d button[aria-pressed=true]{background:#314b39;color:#fff}.dir-d code,.dir-d .d-num{font-family:Consolas,monospace;font-variant-numeric:tabular-nums}.dir-d .d-head{padding:15px 18px;display:flex;align-items:start;justify-content:space-between;border-bottom:1px solid #a5b7a4}.dir-d .d-head strong{font-size:19px;letter-spacing:1px;font-weight:500}.dir-d .d-head small{display:block;color:#506151}.dir-d .d-stamp{border:1px solid #829980;padding:3px 8px;white-space:nowrap}.dir-d .d-crumb{padding:8px 18px;font-family:Consolas,'Microsoft YaHei',sans-serif;border-bottom:1px solid #a5b7a4;background:#f7f8f2;display:flex;gap:9px;flex-wrap:wrap}.dir-d .d-work{display:grid;grid-template-columns:44% 56%;min-height:0}.dir-d .d-index{overflow:auto;overscroll-behavior:contain;border-right:1px solid #a5b7a4;padding:12px}.dir-d .d-caption{font-size:11px;color:#506151;display:flex;justify-content:space-between;margin-bottom:9px}.dir-d .d-row{display:grid;grid-template-columns:1fr auto;width:100%;text-align:left;gap:2px;margin-bottom:5px;background:#f4f6ed;padding:8px}.dir-d .d-row span{font-size:11px}.dir-d .d-row small{grid-column:1/-1}.dir-d .d-detail{overflow:auto;overscroll-behavior:contain;padding:16px}.dir-d .d-detail h3{font-weight:500;font-size:17px;margin:0 0 8px}.dir-d .d-detail p{margin:7px 0 13px}.dir-d .d-object{display:flex;gap:6px;margin:10px 0;align-items:center}.dir-d .d-object span{padding:5px;border:1px solid #a5b7a4;background:#f7f8f2}.dir-d .d-tabs{display:flex;gap:5px;margin:12px 0}.dir-d .d-facts{margin:8px 0;border-top:1px solid #a5b7a4;border-bottom:1px solid #a5b7a4;padding:7px 0;display:flex;justify-content:space-between}.dir-d pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.7 Consolas,'Microsoft YaHei',sans-serif;background:#f7f8f2;padding:10px}.dir-d .d-note{font-size:10px;color:#506151}@container (max-width:500px){.dir-d .d-work{grid-template-columns:1fr}.dir-d .d-index{max-height:135px;border-right:0;border-bottom:1px solid #a5b7a4}.dir-d .d-detail{min-height:150px}.dir-d .d-head{padding:10px}.dir-d .d-head strong{font-size:17px}}
</style>
<section class="dir-d" aria-label="证据索引方向样机">
 <header class="d-head"><div><strong>任务证据索引</strong><small>CXTE-4 · V2 传输加密迁移 · 方向样机</small></div><span class="d-stamp">业务状态：待审核</span></header>
 <div class="d-crumb"><span>工作区 cx_test_new</span><span>/</span><span>任务 CXTE-4</span><span>/</span><b class="d-current">#94b3fc12</b></div>
 <div class="d-work"><div class="d-index"><div class="d-caption"><span>运行索引 · 9 次</span><span>最新优先</span></div><div class="d-rows"></div></div><div class="d-detail" aria-live="polite"></div></div>
</section>
<script>(()=>{const root=document.querySelector('.dir-d'),data=window.PREVIEW_DATA;let selected=data.runs[0],tab='output';const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clock=d=>new Date(d).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});const duration=r=>{const t=Math.round((Date.parse(r.completedAt)-Date.parse(r.startedAt))/1000);return Math.floor(t/60)+' 分 '+t%60+' 秒'};
function render(){root.querySelector('.d-current').textContent='#'+selected.id.slice(-8);root.querySelector('.d-rows').innerHTML=data.runs.map(r=>`<button class="d-row" data-run="${r.id}" aria-pressed="${r.id===selected.id}"><b>${escape(r.agentName)}</b><code>${r.id.slice(-8)}</code><small>${clock(r.startedAt)} · ${r.status==='completed'?'运行完成':'运行失败'} · ${duration(r)}</small></button>`).join('');const comment=data.comments.comments.find(c=>c.sourceTaskId===selected.id);const isLatest=selected.id===data.runs[0].id;const output=comment?.content|| (isLatest?'修订已复核采纳。需求侧确认无阻塞澄清项，等 G1 评审通过后进入设计。':selected.id.endsWith('e451fb6a')?'收到交接。PM 侧已独立核对产物与分支，形式核对通过；流水线现停在需求澄清阶段等你拍板，需求评审（G1）未启动。':selected.status==='failed'?'连接中途被重置：ECONNRESET。':'请查看这次运行关联的正式回复。');root.querySelector('.d-detail').innerHTML=`<div class="d-caption"><span>${isLatest?'最新一次运行':'历史运行 · 输出按当时记录展示'}</span><span>${clock(selected.startedAt)}</span></div><h3>${escape(selected.agentName)} <code>#${selected.id.slice(-8)}</code></h3><div class="d-object"><span>CXTE-4</span>→<span>本次运行</span>→<span>正式回复</span></div><div class="d-note">数据归属关系，不表示调用顺序</div><div class="d-facts"><span>${duration(selected)}</span><span>${selected.logCount} 条原始日志</span><span>${selected.status==='completed'?'运行完成':'运行失败'}</span></div><div class="d-tabs"><button data-tab="output" aria-pressed="${tab==='output'}">正式输出</button><button data-tab="evidence" aria-pressed="${tab==='evidence'}">来源与证据</button></div>${tab==='output'?`<p>${escape(output.split('\n\n')[0].replace(/\*\*/g,'').slice(0,260))}</p><details><summary>展开正式回复原文</summary><pre>${escape(output)}</pre></details>`:`<p>任务、运行和日志分别保留来源标识，可按运行查找证据。</p><pre>issue_id: ${data.issue.id}\nrun_id: ${selected.id}\n原始日志: ${selected.logCount} 条\n来源: 2026-11-05 08:33 静态快照</pre>`}`;}
root.addEventListener('click',e=>{const row=e.target.closest('[data-run]');if(row){selected=data.runs.find(r=>r.id===row.dataset.run);render()}const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render()}});render();})();</script>
